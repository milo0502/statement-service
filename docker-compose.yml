services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: statements
      POSTGRES_USER: statements
      POSTGRES_PASSWORD: statements
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statements -d statements"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/statements || true &&
      mc anonymous set none local/statements || true &&
      echo 'MinIO bucket statements ready';
      "

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/statements
      DB_USER: statements
      DB_PASS: statements

      S3_ENDPOINT: http://minio:9000
      S3_EXTERNAL_ENDPOINT: http://localhost:9000
      S3_REGION: af-south-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: statements
      S3_CONNECTION_TIMEOUT_MS: 2000
      S3_SOCKET_TIMEOUT_MS: 5000
      S3_API_CALL_TIMEOUT_MS: 10000
      S3_API_CALL_ATTEMPT_TIMEOUT_MS: 4000
      S3_MAX_RETRIES: 3

      RATE_LIMIT_DOWNLOAD_LINK_LIMIT: 10
      RATE_LIMIT_DOWNLOAD_LINK_WINDOW_SECONDS: 60

      SHUTDOWN_PHASE_TIMEOUT: 30s
      SERVER_CONNECTION_TIMEOUT: 20s
      SERVER_KEEP_ALIVE_TIMEOUT: 15s
      SERVER_MAX_KEEP_ALIVE_REQUESTS: 100
      SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: 16KB
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
      SPRING_SERVLET_MULTIPART_LOCATION: /tmp/statement-service-uploads

      HIKARI_MAX_POOL_SIZE: 10
      HIKARI_MIN_IDLE: 2
      HIKARI_CONNECTION_TIMEOUT_MS: 30000
      HIKARI_IDLE_TIMEOUT_MS: 600000
      HIKARI_MAX_LIFETIME_MS: 1800000
      HIKARI_LEAK_DETECTION_THRESHOLD_MS: 60000

      JWT_ISSUER: https://idp.example.com/
      JWT_AUDIENCE: statement-service
      JWT_JWK_SET_URI: https://idp.example.com/.well-known/jwks.json
    ports:
      - "8080:8080"
